apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "etcdmon.fullname" . }}
  labels:
    {{- include "etcdmon.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: [pods]
  verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "etcdmon.fullname" . }}
  labels:
    {{- include "etcdmon.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "etcdmon.fullname" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "etcdmon.fullname" . }}
  namespace: {{ .Release.Namespace }}
